id: app-no-db-import
language: TypeScript
severity: error
message: "src/app must reach data through tRPC, not ~/server/db."
files:
  - "src/app/**"
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    kind: string
    regex: "^.~/server/db(/|.$)"
---

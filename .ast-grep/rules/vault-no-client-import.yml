id: vault-no-component-import
language: TypeScript
severity: error
message: "Feature components must not import ~/server/vault. Resolve secrets server-side."
files:
  - "src/features/*/components/**"
rule:
  kind: import_statement
  has:
    field: source
    kind: string
    regex: "^.~/server/vault"
---

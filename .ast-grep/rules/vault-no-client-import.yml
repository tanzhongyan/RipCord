id: vault-no-client-import
language: Tsx
severity: error
message: "Files with 'use client' must not import ~/server/vault. Resolve secrets server-side."
rule:
  kind: import_statement
  has:
    field: source
    kind: string
    regex: "^.~/server/vault"
  inside:
    kind: program
    has:
      kind: expression_statement
      regex: "^.use client."
---
